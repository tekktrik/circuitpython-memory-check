name: 'CircuitPython Memory Check Preparation'
description: 'Build the firmware to analyze imported memory'
inputs:
  version:
    description: 'Version of CircuitPython to simulate'
    required: true
    default: latest
  circuitpython-folder:
    description: 'Folder name to use for the CircuitPython checkout'
    required: true
    default: 'cpysim'
runs:
  using: "composite"
  steps:
    - name: Setup Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Setup system dependencies
      uses: tekktrik/simulate-circuitpython-nativesim/prepare-system@v3
    - name: Download nativesim firmware
      uses: tekktrik/simulate-circuitpython-nativesim/download-firmware@v3
      with:
        version: ${{ inputs.version }}
        firmware-filepath: ./firmware.exe
    - name: TEMPORARY - Debug library paths
      shell: bash
      run: |
        ldd /home/runner/work/Adafruit_CircuitPython_ImageLoad/Adafruit_CircuitPython_ImageLoad/firmware.exe
        find /usr/lib -name "libSDL2*"
    - name: Upload firmware as artifact
      uses: actions/upload-artifact@v7
      with:
        name: firmware.exe
        path: ./firmware.exe
